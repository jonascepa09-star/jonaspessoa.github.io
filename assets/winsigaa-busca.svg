<text x="94" y="38" class="heading">WinSIGAA</text><text x="94" y="59" class="muted">Central de Busca de Prontuários e Relatórios</text>
<rect x="880" y="25" width="360" height="32" rx="16" fill="#ecfdf5"/><text x="900" y="46" style="fill:#047857;font-size:12px">DEMONSTRAÇÃO · DADOS FICTÍCIOS</text>
<text x="40" y="120" class="heading">Nova busca e pesquisa de turmas</text><text x="40" y="145" class="muted">Escolha o módulo, ajuste os filtros e encontre a turma digitando.</text>
<rect x="40" y="170" width="1200" height="235" rx="12" fill="white" stroke="#e2e8f0"/><text x="64" y="205" class="heading" style="">1   O que você deseja consultar?</text><rect x="64" y="225" width="560" height="88" rx="12" fill="#f0f9ff" stroke="#0284c7"/><text x="84" y="258" class="heading" style="">Ficha Financeira</text><text x="84" y="285" class="muted" style="">Parcelas, vencimentos, pagamentos e saldo financeiro.</text><rect x="644" y="225" width="570" height="88" rx="12" fill="white" stroke="#e2e8f0"/><text x="664" y="258" class="heading" style="">Matrícula / Acadêmico</text><text x="664" y="285" class="muted" style="">Cursos, turmas, períodos e situação da matrícula.</text><text x="64" y="341" class="label" style="">Curso especificado</text><rect x="64" y="352" width="540" height="36" rx="12" fill="white" stroke="#e2e8f0"/><text x="78" y="376" class="muted" style="">Todos os Cursos</text><text x="624" y="341" class="label" style="">Ano letivo</text><rect x="624" y="352" width="260" height="36" rx="12" fill="white" stroke="#e2e8f0"/><text x="638" y="376" class="muted" style="">2026</text><text x="914" y="375" class="muted" style="">☑ Apenas parcelas em aberto</text><rect x="40" y="425" width="1200" height="225" rx="12" fill="white" stroke="#e2e8f0"/><text x="64" y="462" class="heading" style="">2   Informe os Prontuários</text><rect x="64" y="480" width="1150" height="36" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/><text x="82" y="504" class="label" style="">Selecionar Turma do Sistema</text><text x="430" y="504" class="muted" style="">Digitar ou Colar Prontuários</text><text x="780" y="504" class="muted" style="">Importar Planilha Excel</text><rect x="64" y="530" width="1150" height="40" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><text x="80" y="556" class="muted" style="">enf 242</text><text x="930" y="556" class="small" style="">Pesquisar turma</text><rect x="64" y="582" width="800" height="40" rx="12" fill="white" stroke="#e2e8f0"/><text x="80" y="608" class="muted" style="">2026 - AUX DE ENF - NOITE - TM 242 (020/BN)</text><rect x="884" y="582" width="330" height="40" rx="12" fill="#059669" stroke="#059669"/><text x="902" y="608" class="label" style="fill:white">Exportar lista da turma (.xlsx)</text><rect x="40" y="670" width="1200" height="54" rx="12" fill="#0284c7" stroke="#0284c7"/><text x="360" y="704" class="heading" style="fill:white">BUSCAR AGORA · Exibir na tela e salvar</text><text x="44" y="750" class="muted" style="">Digite nome, código ou ano. Combine termos: “enf 242”. A busca ignora acentos.</text>
<text x="40" y="794" class="small">CEPA / Gestão Escolar</text><text x="740" y="794" class="small">Ilustração demonstrativa · Layout adaptado ao aplicativo desktop</text></svg>